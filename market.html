<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>השוק של דובי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Rubik,Arial,sans-serif;color:#123b61;background:linear-gradient(180deg,#7ddcf2 0%,#cdf0e2 55%,#fff1a9 100%);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.app{height:100vh;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.top{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.iconbtn{border:0;background:#fff;border-radius:14px;width:46px;height:40px;font-size:21px;box-shadow:0 4px #137d9f;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px #137d9f}
.pill{flex:1 1 0;background:#fff;border-radius:14px;padding:8px 6px;font-weight:800;font-size:16px;text-align:center;box-shadow:0 4px #ddae35;white-space:nowrap;overflow:hidden}
.pill.lvl{background:#fff7e6;letter-spacing:-2px}
.pill.bump{animation:bump .5s}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}

/* ---------- panels / buttons ---------- */
.panel{background:#fff;border-radius:20px;box-shadow:0 5px #137d9f;padding:10px 12px}
.say{border:0;background:#ffd447;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 4px #ddae35;flex-shrink:0;padding:0}
.say:active{transform:translateY(3px);box-shadow:0 1px #ddae35}
.bigbtn{border:0;border-radius:18px;padding:12px 18px;font-size:20px;font-weight:900;color:#fff;box-shadow:0 6px rgba(0,0,0,.2)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px rgba(0,0,0,.2)}
.bigbtn.go{background:linear-gradient(135deg,#ffb45c,#ff8a1f);box-shadow:0 6px #c86510}
.bigbtn.ok{background:linear-gradient(135deg,#27d99f,#00b983);box-shadow:0 6px #078d6d}
.bigbtn.blue{background:linear-gradient(135deg,#4cc3ee,#168db7);box-shadow:0 6px #0c6a8c}
.linkbtn{border:0;background:none;font-size:16px;font-weight:800;color:#137d9f;padding:8px;margin-top:4px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}

/* ---------- money ---------- */
.money{filter:drop-shadow(0 4px 4px #0005);transition:transform .15s;flex:0 0 auto}
.money.tap{cursor:pointer}
.money.tap:active{transform:scale(.9)}
.money img{display:block;object-fit:contain}
.money.coin img{border-radius:50%}
.money.new{animation:popIn .35s both}

/* ---------- start screen ---------- */
.start{position:fixed;inset:0;z-index:8000;background:linear-gradient(180deg,#7ddcf2 0%,#cdf0e2 55%,#fff1a9 100%);overflow-y:auto;display:flex;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transition:opacity .35s}
.start.gone{opacity:0;pointer-events:none}
.start .inner{margin:auto;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.start-title{font-size:36px;font-weight:900;color:#fff;text-shadow:0 4px #ed8a31;margin:0;text-align:center}
.sbear{font-size:78px;line-height:1;animation:bob 2.2s ease-in-out infinite}
.bubble{background:#fff;border-radius:24px;padding:10px 20px;font-size:25px;font-weight:900;box-shadow:0 6px #137d9f;position:relative;display:flex;align-items:center;gap:10px}
.bubble:after{content:'';position:absolute;top:-20px;right:50%;border:10px solid transparent;border-bottom:12px solid #fff}
.cards{display:flex;flex-direction:column;gap:16px;width:100%}
.card{position:relative;border:0;border-radius:26px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#fff;text-align:right;transition:transform .15s,filter .15s;animation:popIn .5s both}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}
.card:active{transform:translateY(6px) scale(.98)}
.card.picked{transform:scale(1.06);filter:brightness(1.12)}
.card.picked:after{content:'✅';position:absolute;top:-12px;left:-8px;font-size:34px;animation:popIn .3s both}
.card .big{font-size:34px;letter-spacing:-4px;min-width:92px;text-align:center;filter:drop-shadow(0 3px 0 #0003);line-height:1.1}
.card .txt{font-size:25px;font-weight:900;flex:1;min-width:0}
.card .txt small{display:block;font-size:16px;font-weight:700;opacity:.95;margin-top:1px}
.card .wins{display:inline-block;font-size:14px;font-weight:800;background:#ffffff38;border-radius:10px;padding:1px 8px;margin-top:4px}
.mini{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:5px}
.mini img{display:block;height:26px;width:26px;border-radius:50%;filter:drop-shadow(0 2px 2px #0004)}
.mini img.b{height:24px;width:44px;object-fit:cover;border-radius:3px}
.card.cg{background:linear-gradient(135deg,#27d99f,#00b983);box-shadow:0 8px #078d6d}
.card.co{background:linear-gradient(135deg,#ffb45c,#ff8a1f);box-shadow:0 8px #c86510}
.card.cp{background:linear-gradient(135deg,#b07cff,#8a4dff);box-shadow:0 8px #5f2cc0}
@media(max-height:680px){.sbear{font-size:54px}.start-title{font-size:28px}.bubble{font-size:21px;padding:8px 16px}.card{padding:10px 12px}.card .big{font-size:28px;min-width:78px}.card .txt{font-size:21px}.cards{gap:12px}.start .inner{gap:10px}}

/* ---------- overlay sheet ---------- */
.veil{position:fixed;inset:0;z-index:9000;background:rgba(10,35,45,.55);display:none;align-items:flex-end;justify-content:center;padding:12px}
.veil.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:calc(100dvh - 24px);overflow-y:auto;background:#fff;border-radius:28px;padding:16px;box-shadow:0 10px 0 #d8dee6,0 20px 40px rgba(0,0,0,.3);text-align:center;animation:sheetUp .35s cubic-bezier(.3,1.4,.5,1) both;margin-bottom:env(safe-area-inset-bottom)}
@keyframes sheetUp{from{transform:translateY(60%);opacity:0}to{transform:translateY(0);opacity:1}}
.win .winbig{font-size:70px;line-height:1;animation:popIn .5s both}
.win .wint{font-size:32px;font-weight:900;color:#00976e;margin:6px 0}
.win .wsub{font-size:22px;font-weight:800}
.win .wsub b{color:#e83f70;font-size:28px}
.win .winstars{font-size:22px;font-weight:900;margin:8px 0;color:#ff9e40}

/* ---------- toast / confetti ---------- */
#celebration{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(24px);background:#123b61;color:#fff;padding:12px 22px;border-radius:22px;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .3s,transform .3s;z-index:10001;pointer-events:none;text-align:center;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.pill{font-size:14px;padding:6px 4px}.iconbtn{width:40px;height:34px;font-size:18px}.toast{font-size:15px}}

/* ================= MARKET ================= */
.mission{display:flex;align-items:center;gap:10px;flex:0 0 auto;border:4px solid #ffd447;box-shadow:0 5px #ddae35}
.budget{flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffd447 60%,#e8b21f);box-shadow:0 4px #b98a10,inset 0 -4px 0 #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.budget small{font-size:12px;font-weight:800}
.budget b{font-size:22px;font-weight:900;color:#a4331b;white-space:nowrap}
.task{flex:1;font-size:20px;font-weight:900;line-height:1.25}
.wallet{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:70px;box-shadow:0 5px #078d6d;border:3px solid #00c995;padding:6px 10px}
.wtitle{font-size:15px;font-weight:900;flex:0 0 auto;text-align:center;line-height:1.1}
.wcoins{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;height:58px;overflow:hidden}
.wcoins:empty:before{content:'הארנק ריק! 🫙';font-weight:800;color:#56807a}
.wnum{flex:0 0 auto;background:#e9fff7;border:3px solid #00c995;border-radius:14px;padding:4px 10px;font-size:19px;font-weight:900;color:#08795b;white-space:nowrap}
.wclosed{flex:1;display:none;text-align:center;font-size:18px;font-weight:900;color:#08795b}
.app:not(.w-num) .wnum{display:none}
.app:not(.w-coins) .wcoins{display:none}
.app:not(.w-coins) .wclosed{display:block}
.shelf{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#f7e2c0,#eccb97);border-radius:20px;box-shadow:0 5px #b98a4a;overflow:hidden}
.awning{flex:0 0 auto;height:22px;background:repeating-linear-gradient(90deg,#ff5d7a 0 28px,#fff 28px 56px);border-radius:0 0 50% 50%/0 0 12px 12px;box-shadow:0 3px 0 #0001}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;padding:10px;align-content:start}
.prod{position:relative;border:0;background:#fff;border-radius:18px;padding:8px 4px 10px;box-shadow:0 5px #c9a46b;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,filter .2s,opacity .2s;animation:popIn .4s backwards}
.prod:active{transform:translateY(4px);box-shadow:0 1px #c9a46b}
.prod .pe{font-size:44px;line-height:1.1}
.prod .pn{font-size:15px;font-weight:800}
.prod .pp{background:#ff3b6b;color:#fff;font-weight:900;font-size:17px;border-radius:12px;padding:2px 10px;transform:rotate(-4deg);box-shadow:0 3px #b91f40;white-space:nowrap}
.prod.cant{filter:grayscale(1);opacity:.45}
.basket{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:4px solid #ff9e40;box-shadow:0 5px #db7923;padding:8px 10px}
.bleft{flex:1;min-width:0}
.bhead{display:flex;justify-content:space-between;gap:6px;font-size:16px;font-weight:900}
.bhead b{background:#ff9e40;color:#fff;border-radius:10px;padding:0 8px}
.btotal{color:#e83f70}
.bitems{display:flex;gap:6px;overflow-x:auto;min-height:52px;align-items:center;padding:4px 0}
.bitems:empty:before{content:'לחצו על מוצר כדי לקנות 👆';font-size:14px;font-weight:700;color:#a0692a}
.chip{flex:0 0 auto;border:2px solid #ffcf9b;background:#fff7e6;border-radius:14px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;line-height:1;animation:popIn .3s both}
.chip span{font-size:28px}
.chip small{font-size:12px;font-weight:900;color:#e83f70;margin-top:2px}
#checkout{flex:0 0 auto;font-size:19px;padding:14px 14px}
#checkout.ready{animation:pulse 1s infinite}
.basket.bump{animation:bump .4s}
.flyer{position:fixed;z-index:7000;font-size:40px;pointer-events:none}
/* question sheet */
.sh-head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
.sbear2{font-size:48px;animation:bob 2.2s ease-in-out infinite}
.sh-q{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px}
.receipt{background:#fffdf5;border:2px dashed #d7c49a;border-radius:14px;padding:8px 12px;margin:0 auto 10px;max-width:340px;font-size:17px;font-weight:700;text-align:right}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.rl b{white-space:nowrap}
.rl.had{color:#08795b;border-bottom:2px solid #eee;padding-bottom:6px;margin-bottom:4px;font-weight:900}
.rl.tot{border-top:2px solid #eee;margin-top:4px;padding-top:6px;color:#e83f70;font-weight:900}
.sh-coins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:0 0 10px;min-height:10px}
.sh-coins-t{font-size:15px;font-weight:800;color:#08795b;margin-bottom:4px}
.opts{display:flex;gap:12px;justify-content:center;margin:6px 0 4px}
.opt{border:0;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffd447 60%,#e8b21f);box-shadow:0 6px #b98a10;font-size:26px;font-weight:900;color:#7a3a10;animation:popIn .4s both;line-height:1}
.opt small{font-size:15px}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}
.opt:active{transform:translateY(4px);box-shadow:0 2px #b98a10}
.opt.wrong{filter:grayscale(1);opacity:.4;pointer-events:none}
.opt.right{background:radial-gradient(circle at 35% 30%,#d9fff0,#27d99f 60%,#00a372);color:#fff;transform:scale(1.12)}
@media(max-width:700px){
.app{gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.budget{width:62px;height:62px}.budget b{font-size:18px}.budget small{font-size:11px}
.task{font-size:16px}
.wallet{min-height:58px}.wcoins{height:46px}.wnum{font-size:16px;padding:3px 8px}.wtitle{font-size:13px}
.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:8px}
.prod .pe{font-size:36px}.prod .pn{font-size:13px}.prod .pp{font-size:15px}
.bitems{min-height:46px}.chip span{font-size:24px}
#checkout{font-size:16px;padding:12px 10px}
.opt{width:80px;height:80px;font-size:23px}
.sh-q{font-size:20px}.receipt{font-size:15px}
}
@media(max-height:620px){.mission{padding:6px 10px}.budget{width:54px;height:54px}.budget b{font-size:16px}.wallet{min-height:50px}.wcoins{height:40px}}
</style>
</head>
<body>
<canvas id="celebration" aria-hidden="true"></canvas>
<div class="toast" id="toast"></div>

<!-- ================= START ================= -->
<div class="start" id="start"><div class="inner">
  <h1 class="start-title">🧺 השוק של דובי</h1>
  <div class="sbear">🐻</div>
  <div class="bubble">כמה כוכבים? <button class="say" id="startSay" aria-label="השמע">🔊</button></div>
  <div class="cards">
    <button class="card cg" data-level="1" data-audio="lvl1" data-say="כוכב אחד. קל!">
      <span class="big">⭐</span>
      <span class="txt">קל<small>👛 יש לך 10 ₪</small><span class="mini" data-mini="1"></span><span class="wins" data-wins="1"></span></span>
    </button>
    <button class="card co" data-level="2" data-audio="lvl2" data-say="שני כוכבים. בינוני!">
      <span class="big">⭐⭐</span>
      <span class="txt">בינוני<small>👛 יש לך 20 ₪</small><span class="mini" data-mini="2"></span><span class="wins" data-wins="2"></span></span>
    </button>
    <button class="card cp" data-level="3" data-audio="lvl3" data-say="שלושה כוכבים. אלוף!">
      <span class="big">⭐⭐⭐</span>
      <span class="txt">אלוף 👑<small>👛 יש לך 50 ₪</small><span class="mini" data-mini="3"></span><span class="wins" data-wins="3"></span></span>
    </button>
  </div>
</div></div>

<!-- ================= GAME ================= -->
<main class="app" id="app">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="בית">🏠</button>
    <div class="pill lvl" id="levelPill">⭐</div>
    <div class="pill" id="starPill">⭐ <b id="stars">0</b></div>
    <button class="iconbtn" id="soundBtn" aria-label="קול">🔊</button>
  </div>
  <section class="panel mission" id="mission">
    <div class="budget"><small>יש לך</small><b id="budget">20 ₪</b></div>
    <div class="task" id="task"></div>
    <button class="say" id="replay" aria-label="השמע שוב">🔊</button>
  </section>
  <section class="panel wallet" id="walletP">
    <div class="wtitle">👛<br>בארנק</div>
    <div class="wcoins" id="wcoins"></div>
    <div class="wnum" id="wnum"></div>
    <div class="wclosed">👛❓ תזכרו כמה נשאר!</div>
  </section>
  <section class="shelf"><div class="awning"></div><div class="grid" id="shelf"></div></section>
  <section class="panel basket" id="basketP">
    <div class="bleft">
      <div class="bhead"><span>🧺 הסל שלי <b id="bcount"></b></span><span class="btotal" id="btotal"></span></div>
      <div class="bitems" id="basket"></div>
    </div>
    <button class="bigbtn go" id="checkout">🛒 לקופה!</button>
  </section>
</main>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script>
/* MARKET SOUND ENGINE: asset files only. No Chrome/browser speech. */
(function(){
'use strict';
if(window.DubiSound&&typeof window.DubiSound.speak==='function')return;
const VOICE='assets/audio/', SFX='assets/sfx/';
let voice=null, token=0, muted=false, pending=null, currentDone=null;
const missing=new Set(), pools={};
function audio(){
  if(!voice){voice=new Audio();voice.preload='auto'}
  return voice;
}
function finish(tk,cb){
  if(tk!==token)return;
  pending=null;currentDone=null;
  if(typeof cb==='function')cb();
}
function stop(){
  token++;pending=null;currentDone=null;
  if(voice){voice.onended=null;voice.onerror=null;try{voice.pause()}catch(e){}}
}
function idOf(x){return typeof x==='string'?x:Array.isArray(x)?x[0]:(x&&x.id)||null}
function playId(id,tk,next){
  if(tk!==token||muted||!id||missing.has(id)){next();return}
  const a=audio();let ended=false;
  const done=()=>{if(ended)return;ended=true;a.onended=null;a.onerror=null;if(tk===token)next()};
  const bad=()=>{missing.add(id);console.warn('[MarketSound] Missing '+VOICE+id+'.mp3');done()};
  a.onended=done;a.onerror=bad;
  try{
    a.src=VOICE+encodeURIComponent(id)+'.mp3';
    const pr=a.play();
    if(pr&&pr.catch)pr.catch(err=>{
      if(tk!==token||ended)return;
      if(err&&err.name==='NotAllowedError'){
        pending={a,tk,done};currentDone=done;
      }else if(!err||err.name!=='AbortError')bad();
    });
  }catch(e){bad()}
}
function speak(parts,onDone){
  stop();
  const ids=(parts||[]).map(idOf).filter(Boolean),tk=token;
  if(muted||!ids.length){if(typeof onDone==='function')onDone();return}
  let i=0;
  const next=()=>{
    if(tk!==token)return;
    if(i>=ids.length){finish(tk,onDone);return}
    playId(ids[i++],tk,next);
  };
  next();
}
function sfx(name,vol){
  if(muted||!name)return;
  let list=pools[name]||(pools[name]=[]),a=list.find(x=>x.paused||x.ended);
  if(!a){try{a=new Audio(SFX+name+'.wav');a.preload='auto';list.push(a)}catch(e){return}}
  try{a.currentTime=0;a.volume=typeof vol==='number'?vol:.55;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
}
function money(value){
  let cents=Math.max(0,Math.round(Number(value||0)*100)),sh=Math.floor(cents/100),ag=cents%100,out=[];
  if(sh)out.push({id:'sh_'+sh});
  if(ag)out.push({id:(sh?'and_ag_':'ag_')+ag});
  if(!out.length)out.push({id:'sh_0'});
  return out;
}
function resume(){
  const p=pending;
  if(!p||p.tk!==token||muted)return;
  pending=null;
  try{const pr=p.a.play();if(pr&&pr.catch)pr.catch(()=>p.done())}catch(e){p.done()}
}
['pointerdown','touchend','keydown','click'].forEach(n=>document.addEventListener(n,resume,true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.DubiSound={speak,stop,sfx,money,setMuted(v){muted=!!v;if(muted)stop()},isMuted(){return muted}};
})();
</script>
<script>
'use strict';
const $=x=>document.getElementById(x);

/* ================= MONEY (values in agorot: 100 = 1 ₪) ================= */
const M=[
{c:10,n:'10 אגורות',f:'assets/coin-10-agorot.png',w:66,h:66,k:'coin',a:'m_0_1'},

/* ================= SMALL HELPERS ================= */
function fmt(c){return c%100?(c/100).toFixed(2):String(c/100)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sum(a){return a.reduce((x,y)=>x+y,0)}
function isMobile(){return innerWidth<=700}
/* fewest pieces */
function greedyCoins(amount,denoms){
  const out=[];let r=amount;
  for(const d of [...denoms].sort((a,b)=>b-a)){while(r>=d){out.push(d);r-=d}}
  return out;
}
/* a "natural" mix of coins, like a real customer pays */
function randomCoins(amount,denoms,maxPieces){
  maxPieces=maxPieces||6;
  const ds=[...denoms].sort((a,b)=>b-a),out=[];let r=amount;
  while(r>0){
    const cand=ds.filter(d=>d<=r);if(!cand.length)break;
    let d=cand[0];
    if(cand.length>1&&out.length<maxPieces-2&&Math.random()<.4)d=cand[1];
    out.push(d);r-=d;
  }
  if(out.length>maxPieces+1)return greedyCoins(amount,denoms);
  return out.sort((a,b)=>b-a);
}

function loadStore(key,maxStage){
  const d={stage:[0,0,0],run:[0,0,0],wins:[0,0,0],stars:0,sound:true};
  try{
    const s=JSON.parse(localStorage.getItem(key)||'{}');
    ['stage','run','wins'].forEach(k=>{if(Array.isArray(s[k])&&s[k].length===3)d[k]=s[k].map(x=>Math.max(0,Math.floor(+x)||0))});
    d.stage=d.stage.map(x=>Math.min(maxStage,x));
    if(Number.isFinite(+s.stars))d.stars=Math.max(0,Math.floor(+s.stars));
    if(typeof s.sound==='boolean')d.sound=s.sound;
  }catch(e){}
  return d;
}

function wheelsAfterWin(store,L,firstTry,maxStage){

  DubiSound.sfx('celebrate');
  cancelAnimationFrame(cfFrame);bits=[];
  const colors=['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff','#ff9e40'];
  for(let i=0;i<170;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-8-Math.random()*12,g:.25+Math.random()*.18,r:Math.random()*6.28,w:6+Math.random()*8,h:4+Math.random()*7,c:colors[i%colors.length],life:90+Math.random()*45});
  (function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    bits=bits.filter(p=>p.life-->0);
    for(const p of bits){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.18;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}

const MISSION_TXT={free:'קנו מה שאתם רוצים 🛍️',n2:'קנו בדיוק 2 דברים ✌️',n3:'קנו בדיוק 3 דברים 🤟',exact:'תבזבזו את כל הכסף – בדיוק! 🎯'};

let level=1,cfg=LV[1],mission='free',shelf=[],basket=[],remaining=0,wrongs=0,busy=false,qOpen=false,pendingW=null,introParts=[],token=0;

function stage(){return store.stage[level-1]}
function need(){return mission==='n2'?2:mission==='n3'?3:0}
function spent(){return sum(basket.map(b=>b.price))}
function splitExact(total,k){
  for(let t=0;t<800;t++){
    const parts=[];for(let i=0;i<k-1;i++)parts.push(cfg.price());
    const last=total-sum(parts);
    if(last>=cfg.min&&last<=cfg.max&&last%cfg.unit===0){parts.push(last);return parts}
  }
  return null;
}
function genRound(){
  for(let t=0;t<300;t++){
    mission=pick(cfg.missions);
    const prods=shuffle(P.slice()).slice(0,cfg.shelf);
    const prices=prods.map(()=>cfg.price());
    if(mission==='exact'){const parts=splitExact(cfg.budget,cfg.exactK);if(!parts)continue;parts.forEach((v,i)=>prices[i]=v)}
    const n=need();
    if(n&&sum([...prices].sort((a,b)=>a-b).slice(0,n))>cfg.budget)continue;
    shelf=shuffle(prods.map((p,i)=>({p,price:prices[i]})));
    return;
  }
  mission='free';shelf=shuffle(P.slice()).slice(0,cfg.shelf).map(p=>({p,price:cfg.min}));
}
function render(){

function fly(fromEl,emoji){
  try{
    const r=fromEl.getBoundingClientRect(),t=$('basket').getBoundingClientRect();
    const d=document.createElement('div');d.className='flyer';d.textContent=emoji;
    const x0=r.left+r.width/2-20,y0=r.top+6;
    d.style.left=x0+'px';d.style.top=y0+'px';document.body.append(d);
    const dx=t.left+t.width-60-x0,dy=t.top+4-y0;
    if(d.animate){
      d.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+dx*.5+'px,'+(dy*.5-70)+'px) scale(1.35)'},{transform:'translate('+dx+'px,'+dy+'px) scale(.6)'}],{duration:560,easing:'ease-in'}).onfinish=()=>d.remove();
    }else d.remove();
  }catch(e){}
}
function buy(i,btn){
  if(busy||qOpen)return;
  const it=shelf[i];
  if(it.price>remaining){
    shakeEl(btn);
    speak([prodPart(it.p)].concat(priceParts(it.price),[{id:'mk_no_money',text:'אין מספיק כסף בשביל זה!'}]));
    return;
  }
  DubiSound.sfx('cash');fly(btn,it.p.e);
  basket.push(it);remaining-=it.price;
  if(stage()<2)fillFit($('wcoins'),greedyCoins(remaining,cfg.denoms).map(MC),isMobile()?.5:.62,.28,null);
  $('wnum').textContent='נשאר '+fmt(remaining)+' ₪';
  renderBasket();bump('basketP');
  speak([prodPart(it.p)].concat(priceParts(it.price)));
}
function unbuy(j){
  if(busy||qOpen)return;
  const it=basket.splice(j,1)[0];remaining+=it.price;
  if(stage()<2)fillFit($('wcoins'),greedyCoins(remaining,cfg.denoms).map(MC),isMobile()?.5:.62,.28,null);
  $('wnum').textContent='נשאר '+fmt(remaining)+' ₪';

}

function checkout(){
  if(busy||qOpen)return;
  if(!basket.length){shakeEl($('shelf'));speak([{id:'mk_empty',text:'הסל ריק! בחרו משהו מהמדף.'}]);return}
  const n=need();
  if(n&&basket.length<n){shakeEl($('basketP'));speak([{id:'mk_need_more',text:'צריך לקנות עוד משהו!'}]);return}
  if(n&&basket.length>n){shakeEl($('basketP'));speak([{id:'mk_too_many',text:'יש יותר מדי דברים בסל!'}]);return}
  if(mission==='exact'){
    if(remaining>0){shakeEl($('basketP'));wrongOnce([{id:'mk_not_exact',text:'עוד נשאר כסף! אפשר לקנות עוד.'}]);return}
    win();return;

function answerOptions(){
  const c=remaining,set=new Set([c]);

  if(mission==='exact'){parts=[{id:'mk_exact_win',text:'בול! בזבזתם את כל הכסף בדיוק!'}];sub='בזבזתם הכל – <b>בול!</b> 🎯'}
  else if(remaining===0){parts=[pick(PRAISE),{id:'mk_nothing_left',text:'לא נשאר כלום! בול!'}];sub='לא נשאר כלום – <b>בול!</b>'}
  else{parts=[pick(PRAISE),{id:'mk_left',text:'נשאר לך'}].concat(priceParts(remaining));sub='נשאר לך <b>'+fmt(remaining)+' ₪</b>'}
  const show=()=>{
    $('sheet').innerHTML='<div class="win"><div class="winbig">🎉</div><div class="wint">כל הכבוד!</div><div class="wsub">'+sub+'</div><div class="winstars">⭐ +1</div></div>';
    $('veil').classList.add('show');
  };
  setTimeout(()=>{if(my===token)show()},qOpen?450:0);
  let minPassed=false,voiceDone=false,moved=false;
  const go=()=>{if(moved||my!==token)return;moved=true;newRound()};
  setTimeout(()=>{minPassed=true;if(voiceDone)go()},2600);
  setTimeout(go,8000);
  speak(parts,()=>{voiceDone=true;if(minPassed)go()});
}
function newRound(prefix){
  token++;busy=false;qOpen=false;$('veil').classList.remove('show');
  wrongs=0;basket=[];remaining=cfg.budget;
  const pre=(prefix||[]).slice();
  if(pendingW){
    toast(pendingW==='all'?'🏆 וואו! עכשיו בלי שום עזרה!':'🚲 אתם כבר גדולים! הורדנו עזר אחד');
    pre.push(...wheelsParts(pendingW));pendingW=null;
  }
  genRound();render();
  introParts=[{id:'mk_have',text:'יש לך'}].concat(priceParts(cfg.budget),[MISSION_PART[mission]]);
  speak(pre.concat(introParts));
}
function startLevel(l){level=l;cfg=LV[l];pendingW=null;newRound([{id:'go',text:'יאללה!'}])}

$('checkout').onclick=checkout;
$('replay').onclick=()=>speak(introParts);
setupTopBar(store,KEY,()=>{token++;busy=false;qOpen=false;$('veil').classList.remove('show');openStart()});
initStart({store,welcome:[{id:'mk_welcome',text:'ברוכים הבאים לשוק של דובי!'}],
  mini:l=>LV[l].denoms.slice().reverse(),
  onPick:startLevel});
let rT=null;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if($('start').classList.contains('gone'))render()},150)});
openStart();
</script>
</body>
</html>
