<script>
/* ===== OLD-DEVICE DETECTOR + SCROLL UNLOCK (Samsung Chromebook XE303C12 = Chrome 75/76) =====
   Three independent checks - if ANY says "old browser", <html> gets class="legacy":
     1) real flexbox-gap measurement (missing before Chrome 84)
     2) CSS.supports('aspect-ratio') (missing before Chrome 88)
     3) Chrome version number below 90
   On old browsers the scroll fix is injected right here, so it works even if
   assets/legacy-compat.css is missing or an old copy is cached.
   New devices are not touched. Add ?compat to the URL to see a small "OLD/NEW" badge. */
(function(){
  var html=document.documentElement,old=false;
  try{var d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';d.appendChild(document.createElement('div'));d.appendChild(document.createElement('div'));html.appendChild(d);if(d.scrollHeight!==1)old=true;html.removeChild(d);}catch(e){}
  try{if(!(window.CSS&&CSS.supports&&CSS.supports('aspect-ratio','1 / 1')))old=true;}catch(e){old=true}
  var m=navigator.userAgent.match(/Chrom(?:e|ium)\/(\d+)/);if(m&&+m[1]<90)old=true;
  if(!old)return;
  html.className+=' legacy';
  var g='body[data-game="cashier"],body[data-game="catch"],body[data-game="icecream"],body[data-game="market"],body[data-game="treasure"]';
  var css=
   'html.legacy{height:auto!important;overflow-y:auto!important;overflow-x:hidden!important}'+
   'html.legacy '+g.split(',').join(',html.legacy ')+'{height:auto!important;min-height:100%;overflow-y:visible!important;overflow-x:hidden!important;touch-action:auto!important}'+
   'html.legacy body .app,html.legacy body .game{height:auto!important;min-height:100vh;overflow:visible!important}'+
   'html.legacy body[data-game="catch"] .arena{flex:0 0 auto!important;height:420px!important;min-height:420px!important}'+
   'html.legacy body[data-game="treasure"] .map{flex:0 0 auto!important;min-height:380px!important}'+
   'html.legacy body[data-game="market"] .shelf{flex:0 0 auto!important;overflow:visible!important}'+
   'html.legacy body[data-game="market"] .grid{flex:0 0 auto!important;overflow:visible!important}'+
   'html.legacy body[data-game="cashier"] .counter,html.legacy body[data-game="cashier"] .change{flex:0 0 auto!important;min-height:260px}'+
   'html.legacy body[data-game="icecream"] .app{overflow:visible!important}';
  var s=document.createElement('style');s.id='legacyScroll';s.appendChild(document.createTextNode(css));
  (document.head||html).appendChild(s);
})();
if(/[?&]compat/.test(location.search))addEventListener('load',function(){var b=document.createElement('div');b.textContent=/legacy/.test(document.documentElement.className)?'OLD':'NEW';b.style.cssText='position:fixed;left:4px;bottom:4px;z-index:99999;background:#000;color:#fff;font:bold 14px Arial;padding:3px 7px;border-radius:6px';document.body.appendChild(b)});

<script src="assets/dubi-sound.js"></script>
<script>'use strict';
/* All sound comes from assets/ (dubi-sound.js). No browser voice. */
/* ===== Say hello + explain when the page opens =====
   If the browser allows sound -> speak right away.
   If the browser blocks sound -> show one big "start" button; tapping it speaks. */
function helloOnOpen(sayHello){
  const gate=document.getElementById('helloGate'),btn=document.getElementById('helloBtn');
  let done=false;
  const go=()=>{if(done)return;done=true;gate.classList.remove('show');sayHello()};
  btn.addEventListener('click',go);
  let probe;try{probe=new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==');probe.volume=0}catch(e){gate.classList.add('show');return}
  let p;try{p=probe.play()}catch(e){p=Promise.reject(e)}
  Promise.resolve(p).then(()=>{setTimeout(go,300)}).catch(()=>{if(!done)gate.classList.add('show')});
}

const HELLO=[{id:'menu_hello',text:'שלום! אני דובי, וברוכים הבאים לרכבת משחקי הכסף!'},{id:'menu_explain',text:'כל קרון ברכבת הוא משחק אחר. החליקו לצדדים, בחרו קרון, ולחצו עליו כדי להתחיל לשחק!'}];
let sound=true,leaving=false;
function talk(id,done){if(!sound){if(done)done();return}DubiSound.speak([id],done)}
document.querySelectorAll('.car').forEach(c=>{
  c.setAttribute('data-sfx','whoosh');
  c.onclick=()=>{
    if(leaving||c.classList.contains('selected'))return;
    leaving=true;c.classList.add('selected');
    let gone=false;const go=()=>{if(gone)return;gone=true;location.href=c.dataset.url};
    setTimeout(go,12000);              // never get stuck on the menu
    talk(c.dataset.audio,()=>setTimeout(go,150));
  };
});
/* Fix: going "back" to this menu can restore the page exactly as it was the instant
   a car was tapped (leaving=true, car marked "selected"), which silently blocked every
   future tap. Reset this state every time the menu becomes visible again - on a fresh
   load this is a harmless no-op, and on a back/forward-cache restore it unsticks the menu. */
function resetMenuState(){
  leaving=false;
  document.querySelectorAll('.car.selected').forEach(c=>c.classList.remove('selected'));
}
window.addEventListener('pageshow',resetMenuState);
window.addEventListener('focus',resetMenuState);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resetMenuState()});
function sayHello(){if(sound&&!leaving)DubiSound.speak(HELLO)}
document.getElementById('say').onclick=()=>sayHello();
document.getElementById('sound').onclick=()=>{sound=!sound;DubiSound.setMuted(!sound);document.getElementById('sound').textContent=sound?'\uD83D\uDD0A':'\uD83D\uDD07'};
document.addEventListener('dragstart',e=>e.preventDefault());
helloOnOpen(sayHello);
</script></body></html>
