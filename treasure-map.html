function sequence(parts,next){DubiSound.speak(sound?parts:[],next)}
function priceTalk(n){return DubiSound.money(n)}
function money(v,scale=.8,click){let m=M.find(x=>x.v===v),d=document.createElement('div');d.className='money '+m.k;let i=new Image;i.src=m.f;i.alt=m.n;i.style.width=m.w*scale+'px';i.style.height=m.h*scale+'px';d.append(i);if(click)d.onclick=()=>click(m);return d}function greedy(n,vals){let out=[],r=Math.round(n*10);for(let v of vals.slice().sort((a,b)=>b-a)){let x=Math.round(v*10);while(r>=x){out.push(v);r-=x}}return out}function choose(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return a.sort(()=>Math.random()-.5)}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
let cvs=$('conf'),ctx=cvs.getContext('2d'),bits=[];function resize(){cvs.width=innerWidth;cvs.height=innerHeight}resize();addEventListener('resize',resize);function confetti(){bits=[];for(let i=0,N=FX_LITE?45:130;i<N;i++)bits.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-6-Math.random()*10,c:choose(['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff']),l:90});(function d(){ctx.clearRect(0,0,cvs.width,cvs.height);bits=bits.filter(b=>b.l-->0);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.28;ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,7,5)});if(bits.length)requestAnimationFrame(d)})()}
function levelStart(handler,welcome){document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{let l=+b.dataset.l;talk('lvl'+l,b.dataset.say);setTimeout(()=>{$('start').classList.add('hide');handler(l)},500)});$('startSay').onclick=()=>sayWelcome();$('home').onclick=()=>{stop();$('start').classList.remove('hide');sayWelcome()}}function win(text,next){DubiSound.sfx('celebrate');confetti();$('modal').innerHTML='<div class="big">🎉</div><div class="msg">כל הכבוד!</div><div class="sub">'+text+'</div><button class="btn green" id="continue">ממשיכים! ➡️</button>';$('over').classList.add('show');$('continue').onclick=()=>{$('over').classList.remove('show');next()};talk('correct1','כל הכבוד! בדיוק נכון!')}
$('sound').onclick=()=>{sound=!sound;DubiSound.setMuted(!sound);$('sound').textContent=sound?'🔊':'🔇'};
function sayWelcome(){sequence([['tm_welcome','ברוכים הבאים למפת האוצר!'],['q_stars','כמה כוכבים?']])}

function treasureRain(){for(let i=0,N=FX_LITE?18:44;i<N;i++){let e=document.createElement('div');e.className='coin-rain';e.textContent=choose(['💰','💎','⭐','✨']);e.style.left=(Math.random()*96)+'vw';e.style.animationDelay=(Math.random()*1.2)+'s';e.style.animationDuration=(1.8+Math.random()*1.8)+'s';document.body.append(e);setTimeout(()=>e.remove(),4300)}}function grandFinale(){DubiSound.sfx('treasure');setTimeout(()=>DubiSound.sfx('celebrate'),900);confetti();setTimeout(confetti,600);treasureRain();$('modal').className='modal final-modal';$('modal').innerHTML='<div class="final-title">🏆 מצאתם את האוצר הגדול! 🏆</div><div class="final-bear">🐻☠️</div><div class="final-chest">🎁💎💰</div><div class="final-praise">איזה אלופים! פתרתם את כל מפת האוצר!</div><div class="final-stars">⭐ ⭐ ⭐</div><div class="final-badge"><b>9</b>תחנות<br>הושלמו!</div><div class="sub">התוכי ודובי הפיראט גאים בכם! 🐦</div><div class="final-buttons"><button class="btn final-again" id="again">🗺️ לשחק שוב</button><button class="btn final-home" id="finalHome">🏠 לבחור מפה</button></div>';$('over').classList.add('show');$('again').onclick=()=>{$('over').classList.remove('show');$('modal').className='modal';start(L)};$('finalHome').onclick=()=>{$('over').classList.remove('show');$('modal').className='modal';$('start').classList.remove('hide')};sequence([['treasure_found','וואו! מצאתם את האוצר הגדול!'],['treasure_champs','אתם אלופי מפת האוצר!'],['treasure_proud','דובי הפיראט והתוכי גאים בכם!']])}let L=1,target=0,gems=0,step=0,selected=[],vals=[],parts=[];const Q=['דובי הפיראט הגיע לאי הראשון!','התוכי מצא רמז!','יש תיבה ליד הדקל!','הסירה צריכה מטבעות!','המערה נעולה!','מפתח הזהב מחכה!','עברו ליד התנין!','הדליקו את הלפיד!','מצאו את האוצר!'];function start(l){L=l;gems=0;step=0;$('gems').textContent=0;$('level').textContent='⭐'.repeat(l);vals=l===1?[10,5,2,1]:l===2?[20,10,5,2,1]:[50,20,10,5,2,1,.5];drawWallet();drawPath();round()}function drawWallet(){let w=$('wallet');w.innerHTML='';vals.forEach(v=>{let e=money(v,.72);e.setAttribute('role','button');e.setAttribute('aria-label','הוספת '+M.find(x=>x.v===v).n);e.onclick=()=>{selected.push(v);drawCoins();update();let m=M.find(x=>x.v===v);talk(m.a,m.n)};w.append(e)})}function drawPath(){let p=$('path');p.innerHTML='';for(let i=0;i<9;i++){let b=document.createElement('button');b.className='spot '+(i<step?'done':i===step?'here':'');const landmarks=['🌴','🐒','🌉','⛵','🐊','🗿','🔥','🕳️','🎁'];b.textContent=i<step?'✅':landmarks[i];b.setAttribute('aria-label',i<step?'תחנה הושלמה':i===step?'התחנה הנוכחית':'תחנה בהמשך');p.append(b)}}function round(){selected=[];$('bag').innerHTML='';target=L===1?Math.ceil(Math.random()*10):L===2?Math.ceil(Math.random()*20):Math.round((2+Math.random()*48)*2)/2;$('quest').textContent=Q[step];$('need').textContent='צריך '+target+' ₪';$('total').textContent='0 ₪';parts=[['tm_quest','מצאו בדיוק'],...priceTalk(target)];sequence(parts);drawCoins()}function drawCoins(){let b=$('bag');b.innerHTML='';selected.forEach((v,i)=>{let e=money(v,.72);e.onclick=()=>{selected.splice(i,1);drawCoins();update()};b.append(e)});let choices=$('map').querySelectorAll('.spot');choices.forEach((s,i)=>{if(i!==step)return;s.onclick=()=>{toast('👛 בחרו כסף מהארנק למטה');$('wallet').scrollIntoView({behavior:'smooth',block:'nearest'})}})}function openCoins(){$('modal').innerHTML='<div class="big">🎒</div><div class="msg">בחרו מטבע</div><div class="options" id="coins"></div><button class="btn blue" id="closeCoins">סיימתי</button>';let c=$('coins');vals.forEach(v=>{let b=document.createElement('button');b.className='option';b.append(money(v,.75));b.onclick=()=>{selected.push(v);update();talk(M.find(x=>x.v===v).a,M.find(x=>x.v===v).n)}});$('over').classList.add('show');$('closeCoins').onclick=()=>{$('over').classList.remove('show');drawCoins()}}function update(){$('total').textContent=selected.reduce((a,b)=>a+b,0)+' ₪'}$('dig').onclick=()=>{let s=Math.round(selected.reduce((a,b)=>a+b,0)*10)/10;if(s===target){step++;gems++;$('gems').textContent=gems;drawPath();if(step===9)grandFinale();else win('עברתם לתחנה הבאה במפה! 🗺️',round)}else{shake($('bag'));DubiSound.sfx('wrong');talk(s<target?'missing':'too_much',s<target?'חסר עוד קצת כסף':'יש יותר מדי כסף')}};$('clear').onclick=()=>{selected=[];drawCoins();update()};$('replay').onclick=()=>sequence(parts);levelStart(start,'ברוכים הבאים למפת האוצר!');
setTimeout(()=>{if(!$('start').classList.contains('hide'))sayWelcome()},350);
</script></body></html>
