const ORDER=[200,100,50,20,10,5,2,1,.5,.1],G_ALL=[{n:'גלידה',e:'🍦',u:0},{n:'כדור',e:'⚽',u:0},{n:'ספר',e:'📚',u:0},{n:'פיצה',e:'🍕',u:0},{n:'מיץ',e:'🧃',u:0},{n:'בובה',e:'🧸',u:0},{n:'עוגה',e:'🎂',u:5},{n:'משקפי שמש',e:'🕶️',u:10},{n:'רובוט',e:'🤖',u:15},{n:'גיטרה',e:'🎸',u:20},{n:'אופניים',e:'🚲',u:25}];let level=1,target=0,tray=[],score=0,stars=0,q=1,checking=false,streak=0,correctCount=0,nextBonus=false,bonusRound=false,gameMode='normal',pendingMode='normal',toastTimer=null;function unlockedItems(){return G_ALL.filter(g=>stars>=g.u)}function pickItem(){let arr=unlockedItems();return arr[Math.floor(Math.random()*arr.length)]}function showUnlockToast(item){let el=$('unlockToast');el.textContent='🆕 פריט חדש נפתח: '+item.e+' '+item.n+'!';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
const celebrateCanvas=$('celebration'),celebrateCtx=celebrateCanvas.getContext('2d');let celebrationBits=[],celebrationFrame=0;
function resizeCelebration(){celebrateCanvas.width=innerWidth*devicePixelRatio;celebrateCanvas.height=innerHeight*devicePixelRatio;celebrateCanvas.style.width=innerWidth+'px';celebrateCanvas.style.height=innerHeight+'px';celebrateCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resizeCelebration);resizeCelebration();
function celebrate(){cancelAnimationFrame(celebrationFrame);celebrationBits=[];const colors=['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff','#ff9e40'];for(let i=0;i<180;i++)celebrationBits.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.38,vx:(Math.random()-.5)*15,vy:-8-Math.random()*12,g:.25+Math.random()*.18,r:Math.random()*6.28,w:6+Math.random()*8,h:4+Math.random()*7,c:colors[i%colors.length],life:90+Math.random()*45});$('msg').classList.remove('celebrate-pop');void $('msg').offsetWidth;$('msg').classList.add('celebrate-pop');function draw(){celebrateCtx.clearRect(0,0,innerWidth,innerHeight);celebrationBits=celebrationBits.filter(p=>p.life-->0);for(const p of celebrationBits){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.18;celebrateCtx.save();celebrateCtx.translate(p.x,p.y);celebrateCtx.rotate(p.r);celebrateCtx.fillStyle=p.c;celebrateCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);celebrateCtx.restore()}if(celebrationBits.length)celebrationFrame=requestAnimationFrame(draw);else celebrateCtx.clearRect(0,0,innerWidth,innerHeight)}draw();}
function moneyScale(){return innerWidth<=380?.8:innerWidth<=700?.92:1}function el(m,s){let d=document.createElement('div');d.className='money '+m.k;let i=new Image;i.src=m.f;i.alt=m.n;i.draggable=false;i.style.width=Math.round(m.w*s)+'px';i.style.height=Math.round(m.h*s)+'px';d.append(i);return d}function levelMoney(){let max=level===1?20:level===2?100:200;return ORDER.filter(v=>v<=max&&!((level===1&&(v===.1||v===.5||v===20))||(level===2&&(v===.1||v===.5)))).map(v=>M.find(x=>x.v===v))}function wallet(){let w=$('wallet'),items=levelMoney(),s=moneyScale(),minS=innerWidth<=700?.32:.5;w.innerHTML='';items.forEach(m=>{let d=el(m,s);d.onclick=()=>{tray.push(m);render()};w.append(d)});if(innerWidth<=700){let tries=0;while(w.scrollHeight>w.clientHeight+2&&s>minS&&tries<20){s=Math.max(minS,s-.05);w.innerHTML='';items.forEach(m=>{let d=el(m,s);d.onclick=()=>{tray.push(m);render()};w.append(d)});tries++}}}function minPiecesFor(t){let avail=levelMoney().map(m=>m.v).sort((a,b)=>b-a),remaining=Math.round(t*10),cnt=0;for(const v of avail){let vi=Math.round(v*10);if(vi<=0)continue;let n=Math.floor(remaining/vi);cnt+=n;remaining-=n*vi}return cnt}function streakMultiplier(){return streak>=3?3:streak>=2?2:1}function updateStreakUI(){let m=streakMultiplier();$('streakMultText').textContent='x'+m;let p=$('streakPill');p.classList.remove('x2','x3');if(m===2)p.classList.add('x2');if(m===3)p.classList.add('x3')}function total(){return Math.round(tray.reduce((a,x)=>a+x.v,0)*100)/100}function fmt(n){return n%1?n.toFixed(2):n}function render(){let t=$('tray'),ms=moneyScale(),minS=innerWidth<=700?.32:.5;t.innerHTML='';tray.forEach((m,j)=>{let d=el(m,ms);d.onclick=()=>{tray.splice(j,1);render()};t.append(d)});if(innerWidth<=700){let tries=0;while(t.scrollHeight>t.clientHeight+2&&ms>minS&&tries<20){ms=Math.max(minS,ms-.05);t.innerHTML='';tray.forEach((m,j)=>{let d=el(m,ms);d.onclick=()=>{tray.splice(j,1);render()};t.append(d)});tries++}}let s=total(),over=Math.round((s-target)*100)/100,pct=target?Math.min(100,s/target*100):0,progress=$('progress');$('sum').textContent=fmt(s)+' ₪';$('pcVal').textContent=tray.length;$('prog').style.width=pct+'%';progress.classList.toggle('over',over>0);$('overflowBubble').textContent=over>0?'⚠️ יותר מדי ב־'+fmt(over)+' ₪':'';$('msg').textContent=''}function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}function genNormalTarget(){return level===1?2+Math.floor(Math.random()*18):level===2?(2+Math.floor(Math.random()*39))*5:Math.round((1+Math.random()*200)*10)/10}function genChange(){let price=genNormalTarget();let avail=levelMoney().map(m=>m.v).sort((a,b)=>a-b);let given=avail.find(v=>v>price);if(given===undefined){given=Math.round((price+Math.max(...avail))*10)/10}let change=Math.round((given-price)*100)/100;return{price,given,change}}function genCart(){let n=level===3?3:2;let pool=unlockedItems(),items=[],used=new Set();for(let i=0;i<n && used.size<pool.length;i++){let idx;do{idx=Math.floor(Math.random()*pool.length)}while(used.has(idx));used.add(idx);let it=pool[idx];let price=level===1?randInt(1,9):level===2?randInt(1,10)*5:Math.round((1+Math.random()*40)*10)/10;items.push({n:it.n,e:it.e,price})}let total=Math.round(items.reduce((a,x)=>a+x.price,0)*100)/100;return{items,total}}function newq(){tray=[];bonusRound=nextBonus;nextBonus=false;let qType=bonusRound?'normal':gameMode;let app=document.querySelector('.app');app.classList.remove('mode-normal','mode-change','mode-cart');app.classList.add('mode-'+qType);if(bonusRound){target=2+Math.floor(Math.random()*8);let g=pickItem();$('thing').textContent=g.e;$('question').textContent='כמה כסף צריך בשביל '+g.n+'?';$('target').textContent=fmt(target)+' ₪'}else if(qType==='change'){let{price,given,change}=genChange();target=change;let g=pickItem();$('thing').textContent=g.e;$('question').textContent=g.n+' '+g.e+' עולה '+fmt(price)+' ₪. דובי שילם '+fmt(given)+' ₪. כמה עודף להחזיר?';$('target').textContent=fmt(given)+' ₪ (שולם)'}else if(qType==='cart'){let{items,total}=genCart();target=total;$('question').textContent='כמה כסף צריך בשביל כל הפריטים ביחד?';let cl=$('cartList');cl.innerHTML='';items.forEach(it=>{let d=document.createElement('div');d.className='cart-item';d.innerHTML='<span>'+it.e+' '+it.n+'</span><span class="p">'+fmt(it.price)+' ₪</span>';cl.append(d)})}else{target=genNormalTarget();let g=pickItem();$('thing').textContent=g.e;$('question').textContent='כמה כסף צריך בשביל '+g.n+'?';$('target').textContent=fmt(target)+' ₪'}$('qn').textContent=q;$('bonusBanner').classList.toggle('show',bonusRound);updateStreakUI();render()}$('check').onclick=()=>{let s=total(),d=Math.round(Math.abs(s-target)*100)/100;if(s===target&&!checking){checking=true;let piecesUsed=tray.length,minP=minPiecesFor(target),effBonus=0,effMsg='';if(piecesUsed===minP){effBonus=15;effMsg='<span class="msg-eff">⭐ סופר חכם! מספר מטבעות מינימלי! (+15)</span>'}else if(piecesUsed===minP+1){effBonus=5;effMsg='<span class="msg-eff">👍 כמעט מושלם! מטבע אחד מיותר (+5)</span>'}streak++;let mult=streakMultiplier(),base=10,subtotal=base+effBonus,points=subtotal*mult;if(bonusRound)points*=2;score+=points;stars++;correctCount++;if(correctCount%5===0)nextBonus=true;let newlyUnlocked=G_ALL.find(g=>g.u===stars);if(newlyUnlocked)showUnlockToast(newlyUnlocked);q++;$('score').textContent=score;$('sc').textContent=stars;$('stars').textContent='⭐'.repeat(Math.min(stars,10));updateStreakUI();let bonusMsg=bonusRound?'<span class="msg-bonus">🎁 סיבוב בונוס - ניקוד כפול!</span>':'';let streakMsg=mult>1?'<span class="msg-eff">🔥 רצף x'+mult+'!</span>':'';$('msg').innerHTML='<span class="good">כל הכבוד! בדיוק נכון! 🎉</span>'+effMsg+streakMsg+bonusMsg;celebrate();setTimeout(()=>{checking=false;newq()},2200)}else{streak=0;updateStreakUI();$('msg').innerHTML='<span class="bad">'+(s<target?'חסר ':'יש יותר מדי ')+fmt(d)+' ₪</span>'}};$('clear').onclick=()=>{tray=[];render()};$('next').onclick=()=>{q++;streak=0;updateStreakUI();newq()};let helpers={bar:true,total:true,overflow:true},pendingLevel=level;function applyHelperClasses(){let app=document.querySelector('.app');app.classList.toggle('hide-bar',!helpers.bar);app.classList.toggle('hide-total',!helpers.total);app.classList.toggle('hide-overflow',!helpers.overflow)}applyHelperClasses();function openLevelModal(l){pendingLevel=l;pendingMode=gameMode;$('toggleBar').checked=helpers.bar;$('toggleTotal').checked=helpers.total;$('toggleOverflow').checked=helpers.overflow;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('on',x.dataset.mode===pendingMode));$('modalOverlay').classList.add('show')}document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{pendingMode=b.dataset.mode;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('on',x===b))});function closeModal(){$('modalOverlay').classList.remove('show')}document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>openLevelModal(+b.dataset.l));$('modalConfirm').onclick=()=>{helpers.bar=$('toggleBar').checked;helpers.total=$('toggleTotal').checked;helpers.overflow=$('toggleOverflow').checked;applyHelperClasses();document.querySelectorAll('.levels button').forEach(x=>x.classList.remove('on'));document.querySelector('.levels button[data-l="'+pendingLevel+'"]').classList.add('on');level=pendingLevel;gameMode=pendingMode;streak=0;closeModal();wallet();newq()};$('modalCancel').onclick=closeModal;$('modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')closeModal()};wallet();newq();addEventListener('resize',()=>{wallet();render()});
</script></body></html>
