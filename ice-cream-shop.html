<script>
const $=id=>document.getElementById(id);
/* Lower-powered / pre-2020 browsers (feature-checked, not UA-sniffed) get a lighter confetti burst. */
const FX_LITE=/(^|\s)legacy(\s|$)/.test(document.documentElement.className);
const M=[{v:.1,n:'10 אגורות',f:'assets/coin-10-agorot.png',w:52,h:52,k:'coin',a:'m_0_1'},{v:.5,n:'חצי שקל',f:'assets/coin-half-shekel.png',w:62,h:62,k:'coin',a:'m_0_5'},{v:1,n:'שקל',f:'assets/coin-1-shekel.png',w:44,h:44,k:'coin',a:'m_1'},{v:2,n:'2 שקלים',f:'assets/coin-2-shekels.png',w:52,h:52,k:'coin',a:'m_2'},{v:5,n:'5 שקלים',f:'assets/coin-5-shekels.png',w:58,h:58,k:'coin',a:'m_5'},{v:10,n:'10 שקלים',f:'assets/coin-10-shekels.png',w:56,h:56,k:'coin',a:'m_10'},{v:20,n:'20 שקלים',f:'assets/bill-20.jpg',w:116,h:64,k:'bill',a:'m_20'},{v:50,n:'50 שקלים',f:'assets/bill-50.jpg',w:124,h:64,k:'bill',a:'m_50'}];

function money(v,scale=.8,click){let m=M.find(x=>x.v===v),d=document.createElement('div');d.className='money '+m.k;let i=new Image;i.src=m.f;i.alt=m.n;i.style.width=m.w*scale+'px';i.style.height=m.h*scale+'px';d.append(i);if(click)d.onclick=()=>click(m);return d}function greedy(n,vals){let out=[],r=Math.round(n*10);for(let v of vals.slice().sort((a,b)=>b-a)){let x=Math.round(v*10);while(r>=x){out.push(v);r-=x}}return out}function choose(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return a.sort(()=>Math.random()-.5)}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
let cvs=$('conf'),ctx=cvs.getContext('2d'),bits=[];function resize(){cvs.width=innerWidth;cvs.height=innerHeight}resize();addEventListener('resize',resize);function confetti(){bits=[];for(let i=0,N=FX_LITE?45:130;i<N;i++)bits.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-6-Math.random()*10,c:choose(['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff']),l:90});(function d(){ctx.clearRect(0,0,cvs.width,cvs.height);bits=bits.filter(b=>b.l-->0);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.28;ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,7,5)});if(bits.length)requestAnimationFrame(d)})()}
function levelStart(handler,welcome){document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{let l=+b.dataset.l;talk('lvl'+l,b.dataset.say);setTimeout(()=>{$('start').classList.add('hide');handler(l)},500)});$('startSay').onclick=()=>sayWelcome();$('home').onclick=()=>{stop();$('start').classList.remove('hide');sayWelcome()}}function win(text,next){DubiSound.sfx('celebrate');confetti();$('modal').innerHTML='<div class="big">🎉</div><div class="msg">כל הכבוד!</div><div class="sub">'+text+'</div><button class="btn green" id="continue">ממשיכים! ➡️</button>';$('over').classList.add('show');$('continue').onclick=()=>{$('over').classList.remove('show');next()};talk('correct1','כל הכבוד! בדיוק נכון!')}
$('sound').onclick=()=>{sound=!sound;DubiSound.setMuted(!sound);$('sound').textContent=sound?'🔊':'🔇'};
function sayWelcome(){sequence([['ice_hello','שלום! ברוכים הבאים לגלידריית הקשת של דובי!'],['ice_explain','הלקוח יגיד לכם איזו גלידה הוא רוצה. בחרו כדורים בצבעים הנכונים. אחר כך תראו כמה הלקוח שילם, ותנו לו עודף מהקופה למטה. בסוף לחצו על להגיש ללקוח!'],['q_stars','כמה כוכבים?']])}
/* ===== Say hello + explain when the page opens =====
   If the browser allows sound -> speak right away.
   If the browser blocks sound -> show one big "start" button; tapping it speaks. */
function helloOnOpen(sayHello){
  const gate=document.getElementById('helloGate'),btn=document.getElementById('helloBtn');
  let done=false;
  const go=()=>{if(done)return;done=true;gate.classList.remove('show');sayHello()};
  btn.addEventListener('click',go);
  let probe;try{probe=new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==');probe.volume=0}catch(e){gate.classList.add('show');return}
  let p;try{p=probe.play()}catch(e){p=Promise.reject(e)}
  Promise.resolve(p).then(()=>{setTimeout(go,300)}).catch(()=>{if(!done)gate.classList.add('show')});
}


const FL=[
 {id:'strawberry',flavor:'תות',color:'ורוד',hex:'#f58aaa',dark:'#c74872',voice:'fl_strawberry'},
 {id:'chocolate',flavor:'שוקולד',color:'חום',hex:'#98613f',dark:'#61351f',voice:'fl_chocolate'},
 {id:'vanilla',flavor:'וניל',color:'לבן שמנת',hex:'#fff1c7',dark:'#d7bd80',voice:'fl_vanilla'},
 {id:'banana',flavor:'בננה',color:'צהוב',hex:'#f4dd59',dark:'#c7a821',voice:'fl_banana'},
 {id:'mango',flavor:'מנגו',color:'כתום',hex:'#f5a33c',dark:'#c96a18',voice:'fl_mango'},
 {id:'blueberry',flavor:'אוכמניות',color:'סגול',hex:'#8b73d6',dark:'#55419b',voice:'fl_blueberry'}
];
let L=1,score=0,want=[],made=[],price=0,paid=0,change=[],vals=[],parts=[];
function flavorPhrase(f){return 'כדור '+f.color+' בטעם '+f.flavor}
function start(l){L=l;score=0;$('score').textContent=0;$('level').textContent='⭐'.repeat(l);vals=l===1?[10,5,2,1]:l===2?[20,10,5,2,1]:[50,20,10,5,2,1,.5];buildFlavors();round()}
function buildFlavors(){let box=$('flavors');box.innerHTML='';FL.forEach((f,i)=>{let b=document.createElement('button');b.className='flavor';b.dataset.i=i;b.dataset.sfx='scoop';b.setAttribute('aria-label',flavorPhrase(f));b.innerHTML='<span class="flavor-ball" style="background:linear-gradient(135deg,'+f.hex+','+f.dark+')"></span><b>'+f.color+'</b><small>'+f.flavor+'</small>';b.onclick=()=>{if(made.length>=3){toast('אפשר עד 3 כדורים');talk('ice_max3','אפשר עד שלושה כדורים');return}made.push(i);drawScoops();refreshFlavorButtons();talk(f.voice,flavorPhrase(f))};box.append(b)})}
function refreshFlavorButtons(){document.querySelectorAll('.flavor').forEach(b=>{let i=+b.dataset.i;b.classList.toggle('selected',made.includes(i))})}
function newOrderCount(){return 1+Math.floor(Math.random()*3)}
function round(){made=[];change=[];clearValidation();if($('submitFeedback'))setFeedback('מוכנים? בנו את הגלידה והחזירו עודף 🍦','');let n=newOrderCount();want=shuffle([...Array(FL.length).keys()]).slice(0,n);price=L===1?Math.ceil(Math.random()*10):L===2?Math.ceil(Math.random()*20):Math.round((2+Math.random()*48)*2)/2;let bigger=vals.filter(v=>v>=price);paid=choose(bigger.length?bigger:[price]);if(paid===price&&Math.random()<.6){let x=vals.find(v=>v>price);if(x)paid=x}$('customer').textContent=choose(['🐰','🐶','🐱','🦊','🐼','🐸']);$('scoopCount').textContent=n+' '+(n===1?'כדור':'כדורים');$('order').textContent=n===1?'אני רוצה כדור אחד:':'אני רוצה '+n+' כדורים:';let summary=$('orderSummary');summary.innerHTML='';want.forEach(i=>{let f=FL[i],chip=document.createElement('span');chip.className='order-chip';chip.innerHTML='<span class="color-dot" style="background:'+f.hex+'"></span>'+f.color+' – '+f.flavor;summary.append(chip)});$('cost').innerHTML='<small>💰 מחיר</small>'+price+' ₪';drawPaid();drawScoops();drawChange();parts=[['ice_want_'+n,n===1?'אני רוצה כדור אחד':n===2?'אני רוצה שני כדורים':'אני רוצה שלושה כדורים']];want.forEach(i=>parts.push([FL[i].voice,flavorPhrase(FL[i])]));parts.push(['ice_cost','זה עולה'],...priceTalk(price),...paidParts());sequence(parts)}
function drawScoops(){let s=$('scoops');s.innerHTML='';s.className='scoops n'+made.length;made.forEach((i,pos)=>{let f=FL[i],d=document.createElement('div');d.className='scoop';d.style.background='linear-gradient(135deg,'+f.hex+','+f.dark+')';d.style.zIndex=10+pos;d.innerHTML='<span class="scoop-label">'+f.color+'</span>';d.title=flavorPhrase(f);d.onclick=()=>{made.splice(pos,1);drawScoops();refreshFlavorButtons()};s.append(d)});refreshFlavorButtons()}
function isSmall(){return innerWidth<=600}
function sum(a){return Math.round(a.reduce((x,y)=>x+y,0)*10)/10}
function paidParts(){return[['cs_here','הנה הכסף.'],...priceTalk(paid)]}
function drawChange(){
 const sm=isSmall();
 $('chgTotal').textContent=sum(change)+' ₪';
 let c=$('change');c.innerHTML='';
 change.forEach((v,i)=>{let e=money(v,sm?.42:.6);e.onclick=ev=>{ev.stopPropagation();change.splice(i,1);drawChange()};c.append(e)});
 let d=$('drawer');d.innerHTML='';
 vals.forEach(v=>{let e=money(v,sm?.78:1.05);e.onclick=()=>{change.push(v);drawChange();let m=M.find(x=>x.v===v);talk(m.a,m.n)};d.append(e)});
}
function drawPaid(){
 const sm=isSmall();
 $('paidSum').textContent=paid+' ₪';$('priceSum').textContent=price+' ₪';
 $('paid').innerHTML='';greedy(paid,vals).forEach(v=>$('paid').append(money(v,sm?.5:.8)));
}
let submitBusy=false;
function setFeedback(text,type){let f=$('submitFeedback');f.textContent=text;f.className='submit-feedback '+(type||'');f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function clearValidation(){document.querySelector('.counter').classList.remove('bad-zone','good-zone');document.querySelector('.change').classList.remove('bad-zone','good-zone')}
/* Scoops only need to match the ORDER's set of flavors - the stacking order the
   child clicked them in does not matter (a scoop of pink then brown is the same
   ice-cream as brown then pink). Comparing by count instead of by position fixes
   the bug where a correct combination was sometimes rejected as "wrong colors". */
function counts(arr){let c={};arr.forEach(i=>c[i]=(c[i]||0)+1);return c}
function flavorDiff(){
 let wc=counts(want),mc=counts(made),missing=null,extra=null;
 let keys=new Set([...Object.keys(wc),...Object.keys(mc)]);
 for(let k of keys){let w=wc[k]||0,m=mc[k]||0;if(w>m&&missing===null)missing=+k;if(m>w&&extra===null)extra=+k}
 return{missing,extra};
}
function sameScoops(){
 if(made.length!==want.length)return false;
 let wc=counts(want),mc=counts(made);
 return Object.keys(wc).every(k=>(mc[k]||0)===wc[k])&&Object.keys(mc).every(k=>(wc[k]||0)===mc[k]);
}
function describeScoopProblem(){
 if(made.length<want.length)return 'חסרים '+(want.length-made.length)+' כדורי גלידה. הוסיפו את הכדורים לפי ההזמנה.';
 if(made.length>want.length)return 'יש יותר מדי כדורי גלידה. לחצו על כדור כדי להסיר אותו.';
 let{missing,extra}=flavorDiff();
 if(missing!=null&&extra!=null){let need=FL[missing],has=FL[extra];return 'יש כדור '+has.color+' בטעם '+has.flavor+' שלא צריך. צריך להחליף אותו בכדור '+need.color+' בטעם '+need.flavor+'.';}
 return '';
}
function scoopProblemParts(){
 if(made.length<want.length)return[['ice_need_more','חסרים כדורי גלידה. הוסיפו כדורים לפי ההזמנה.']];
 if(made.length>want.length)return[['ice_too_many','יש יותר מדי כדורי גלידה. לחצו על כדור כדי להסיר אותו.']];
 let{missing}=flavorDiff();
 if(missing!=null){let need=FL[missing];return[['gen_try','לא בדיוק. תסתכלו שוב!'],[need.voice,'צריך גם '+flavorPhrase(need)]]}
 return[['gen_try','לא בדיוק. תסתכלו שוב!']];
}
function submitOrder(ev){
 if(ev){ev.preventDefault();ev.stopPropagation()}
 if(submitBusy||$('over').classList.contains('show'))return false;
 submitBusy=true;let btn=$('serve');btn.classList.add('checking');clearValidation();

 if(!sameScoops()){
   document.querySelector('.counter').classList.add('bad-zone');
   let text=describeScoopProblem();setFeedback('🍦 '+text,'bad');
   DubiSound.sfx('wrong');sequence(scoopProblemParts());setTimeout(()=>{submitBusy=false;btn.classList.remove('checking')},180);return false;
 }
 document.querySelector('.counter').classList.add('good-zone');
 let ch=Math.round(change.reduce((a,b)=>a+b,0)*10)/10,need=Math.round((paid-price)*10)/10;
 if(ch!==need){
   document.querySelector('.change').classList.add('bad-zone');
   let text=ch<need?'חסר עודף. צריך להחזיר '+need+' ₪, ובחרתם '+ch+' ₪.':'יש יותר מדי עודף. צריך להחזיר '+need+' ₪, ובחרתם '+ch+' ₪.';
   setFeedback('💰 '+text,'bad');DubiSound.sfx('wrong');sequence([ch<need?['cs_change_less','חסר לי עוד עודף. נסו שוב!']:['cs_change_more','זה יותר מדי עודף. נסו שוב!'],['ice_need_back','צריך להחזיר'],...priceTalk(need)]);setTimeout(()=>{submitBusy=false;btn.classList.remove('checking')},180);return false;
 }
 document.querySelector('.change').classList.add('good-zone');setFeedback('✅ מצוין! הגלידה והעודף נכונים. מגישים ללקוח!','good');
 score++;$('score').textContent=score;
 setTimeout(()=>{btn.classList.remove('checking');win('בנינו בדיוק את '+want.length+' '+(want.length===1?'הכדור':'הכדורים')+' בצבעים ובטעמים הנכונים! 🍦',()=>{submitBusy=false;setFeedback('מוכנים להזמנה חדשה? 🍦','info');clearValidation();round()})},450);
 return false;
}
$('serve').onclick=submitOrder;
$('paidBox').onclick=()=>sequence(paidParts());
$('priceBox').onclick=()=>sequence([['ice_cost','זה עולה'],...priceTalk(price)]);

$('clear').onclick=()=>{made=[];change=[];drawScoops();drawChange()};$('replay').onclick=()=>sequence(parts);levelStart(start,'ברוכים הבאים לגלידריית דובי!');
