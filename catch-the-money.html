<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>תופסים כסף</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}img{pointer-events:none;-webkit-user-drag:none;user-select:none}.level,.icon,.btn{cursor:pointer;touch-action:manipulation}.level *{pointer-events:none}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#68d7ef;color:#173b59;user-select:none;touch-action:none}button{font-family:inherit}.game{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:8px;gap:7px;background:linear-gradient(#66d6ef 0,#bdecf6 55%,#fff0aa 100%)}.top{display:flex;gap:6px;align-items:center;z-index:10}.icon{border:0;background:white;width:43px;height:38px;border-radius:14px;font-size:20px;box-shadow:0 4px #157e9e}.pill{flex:1;background:white;border-radius:14px;padding:7px 4px;text-align:center;font-weight:900;box-shadow:0 4px #d5a92d;white-space:nowrap}.target{background:linear-gradient(#fff9c8,#ffd84c);color:#913f12}.arena{position:relative;flex:1;min-height:0;overflow:hidden;border:5px solid #fff;border-radius:25px;background:linear-gradient(#47cbea 0 58%,#7bd264 58% 72%,#c38b4a 72% 100%);box-shadow:0 7px #117a98,0 13px 25px #064e6666}.arena:before{content:'☁️ 　　　 ☁️';position:absolute;top:4%;left:0;right:0;text-align:center;font-size:38px;opacity:.8;animation:cloud 6s ease-in-out infinite alternate}.arena:after{content:'🌳　🏡　🌳　🌻　🌳';position:absolute;left:0;right:0;bottom:24%;text-align:center;font-size:31px;white-space:nowrap;opacity:.85}.sun{position:absolute;right:6%;top:6%;font-size:53px;filter:drop-shadow(0 0 12px #ffe45a);animation:sun 4s linear infinite}.wind{position:absolute;left:5%;top:20%;font-size:24px;opacity:.65;animation:wind 3s linear infinite}.money-drop{position:absolute;z-index:5;cursor:pointer;filter:drop-shadow(0 5px 4px #0005);will-change:transform}.money-drop img{display:block;object-fit:contain}.money-drop.coin img{border-radius:50%}.money-drop.golden{filter:drop-shadow(0 0 12px #fff700) drop-shadow(0 5px 4px #0006);animation:gold 0.7s ease-in-out infinite alternate}.power{position:absolute;z-index:7;font-size:42px;filter:drop-shadow(0 5px 3px #0005);animation:powerPulse .7s infinite alternate}.basket{position:absolute;z-index:8;bottom:5%;width:116px;height:72px;transform:translateX(-50%);left:50%;background:linear-gradient(#eaa45e,#a95e28);border:5px solid #6f3818;border-radius:14px 14px 34px 34px;box-shadow:inset 0 8px #ffd19888,0 8px 8px #0004}.basket:before{content:'';position:absolute;left:18px;right:18px;top:-28px;height:39px;border:7px solid #743b1c;border-bottom:0;border-radius:60px 60px 0 0}.basket:after{content:'🧺';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px}.basket.shake{animation:shake .4s}.catch-pop{position:absolute;z-index:20;font-size:25px;font-weight:900;color:#fff;text-shadow:0 3px #005f77;pointer-events:none;animation:popUp .8s forwards}.hud{display:flex;gap:7px;align-items:center}.meter{flex:1;background:#fff;border-radius:17px;padding:6px 9px;box-shadow:0 4px #1682a3}.meter-head{display:flex;justify-content:space-between;font-size:14px;font-weight:900}.bar{height:15px;background:#dceef2;border-radius:10px;overflow:hidden;border:2px solid #167b99}.fill{height:100%;width:0;background:linear-gradient(90deg,#20c98b,#ffd54a);transition:.2s}.fill.over{background:#ff4d6d}.combo{min-width:83px;text-align:center;background:#fff;border-radius:16px;padding:7px;box-shadow:0 4px #d46d19;font-weight:900}.combo.hot{background:#fff0cb;color:#cc4c00;animation:pulse .7s infinite}.power-row{display:flex;gap:5px;min-height:31px;justify-content:center}.power-badge{background:#fff;border-radius:14px;padding:4px 9px;font-size:13px;font-weight:900;box-shadow:0 3px #199a78}.message{position:absolute;z-index:15;top:12%;left:8%;right:8%;text-align:center;background:#ffffffef;border:4px solid #ffd54a;border-radius:20px;padding:9px;font-size:20px;font-weight:900;box-shadow:0 6px #bd861b;opacity:0;transform:scale(.7);pointer-events:none}.message.show{animation:msg 1.25s}.start{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 5%,#c4f9ff,#55d1e7 45%,#0786a8);display:flex;padding:14px;overflow:auto}.start.hide{opacity:0;pointer-events:none}.inside{width:100%;max-width:460px;margin:auto;text-align:center}.title{font-size:38px;color:#fff;text-shadow:0 5px #e17820,0 10px 20px #07556a;margin:2px}.hero{font-size:84px;animation:bob 1.8s infinite}.bubble{display:inline-block;background:#fff;border:4px solid #ffd34c;border-radius:24px;padding:10px 18px;font-weight:900;font-size:23px;box-shadow:0 7px #ad7615}.levels{display:flex;flex-direction:column;gap:14px;margin-top:16px}.level{border:3px solid #ffffffaa;border-radius:26px;padding:13px;color:#fff;display:flex;align-items:center;gap:12px;text-align:right;box-shadow:0 8px #66431d,0 14px 30px #00485b88}.level .stars{font-size:28px;min-width:105px;text-align:center;letter-spacing:-4px}.level b{font-size:24px}.level small{display:block;font-size:15px}.easy{background:linear-gradient(135deg,#2ed99f,#00a878)}.medium{background:linear-gradient(135deg,#ffb44f,#f47b1a)}.hard{background:linear-gradient(135deg,#ad7aff,#7743db)}.overlay{position:fixed;inset:0;z-index:120;background:#103747aa;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{width:min(470px,100%);background:linear-gradient(#fffce2,#f3d986);border:6px solid #7a4418;border-radius:30px;text-align:center;padding:18px;box-shadow:0 11px #3d1c08,0 25px 55px #001a2799}.big{font-size:75px}.win-title{font-size:30px;font-weight:900;color:#078058}.sub{font-size:19px;font-weight:900;margin:7px}.stars-win{font-size:40px;letter-spacing:5px}.btns{display:flex;gap:9px;margin-top:12px}.btn{flex:1;border:0;border-radius:18px;padding:12px 8px;color:white;font-size:17px;font-weight:900;box-shadow:0 6px #0003}.green{background:linear-gradient(135deg,#27d99f,#00a878)}.blue{background:linear-gradient(135deg,#4bc5ee,#168bb4)}#conf{position:fixed;inset:0;z-index:150;pointer-events:none}@keyframes cloud{to{transform:translateX(25px)}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes wind{to{transform:translateX(80px);opacity:0}}@keyframes gold{to{transform:scale(1.12) rotate(8deg)}}@keyframes powerPulse{to{transform:scale(1.15) rotate(8deg)}}@keyframes shake{25%{transform:translateX(calc(-50% - 10px)) rotate(-4deg)}50%{transform:translateX(calc(-50% + 10px)) rotate(4deg)}75%{transform:translateX(calc(-50% - 5px))}}@keyframes popUp{to{transform:translateY(-65px) scale(1.3);opacity:0}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes msg{0%{opacity:0;transform:scale(.7)}20%,75%{opacity:1;transform:scale(1)}100%{opacity:0}}@keyframes bob{50%{transform:translateY(-10px) rotate(5deg)}}@media(max-width:500px){.game{padding:6px}.pill{font-size:13px}.icon{width:39px;height:35px}.arena{border-width:4px}.basket{width:101px;height:63px}.basket:after{font-size:42px}.title{font-size:31px}.hero{font-size:67px}.level b{font-size:21px}.level .stars{min-width:91px;font-size:24px}.meter-head{font-size:12px}.combo{min-width:69px;font-size:13px}.sun{font-size:43px}}
</style>
</head>
<body>
<canvas id="conf"></canvas>
<div class="start" id="start"><div class="inside"><h1 class="title">🧺 תופסים כסף</h1><div class="hero">🐻🪙</div><div class="bubble">תפסו בדיוק את הסכום!</div><div class="levels"><button type="button" class="level easy" data-l="1"><span class="stars">⭐</span><span><b>קל</b><small>כסף איטי · יעד עד 10 ₪</small></span></button><button type="button" class="level medium" data-l="2"><span class="stars">⭐⭐</span><span><b>בינוני</b><small>מהיר יותר · יעד עד 20 ₪</small></span></button><button type="button" class="level hard" data-l="3"><span class="stars">⭐⭐⭐</span><span><b>אלוף 👑</b><small>עד 50 ₪ · חצאי שקל · מכשולים</small></span></button></div></div></div>
<main class="game"><div class="top"><button type="button" class="icon" id="home">🏠</button><div class="pill" id="levelPill">⭐</div><div class="pill target">🎯 <b id="target">10 ₪</b></div><div class="pill">🏆 <b id="score">0</b></div><button type="button" class="icon" id="sound">🔊</button></div><div class="hud"><div class="meter"><div class="meter-head"><span>🧺 נאסף: <b id="total">0 ₪</b></span><span>⏱️ <b id="time">30</b></span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="combo" id="combo">🔥 x1</div></div><div class="power-row" id="powers"></div><section class="arena" id="arena"><div class="sun">☀️</div><div class="wind">💨</div><div class="message" id="message"></div><div class="basket" id="basket"></div></section></main>
<div class="overlay" id="over"><div class="modal" id="modal"></div></div>
<script src="assets/dubi-sound.js"></script>
<script>
'use strict';
const $=x=>document.getElementById(x);
const MONEY=[{v:.5,n:'חצי שקל',f:'assets/coin-half-shekel.png',w:62,h:62,k:'coin'},{v:1,n:'שקל',f:'assets/coin-1-shekel.png',w:47,h:47,k:'coin'},{v:2,n:'שני שקלים',f:'assets/coin-2-shekels.png',w:56,h:56,k:'coin'},{v:5,n:'חמישה שקלים',f:'assets/coin-5-shekels.png',w:61,h:61,k:'coin'},{v:10,n:'עשרה שקלים',f:'assets/coin-10-shekels.png',w:59,h:59,k:'coin'},{v:20,n:'עשרים שקלים',f:'assets/bill-20.jpg',w:125,h:69,k:'bill'}];
const CFG={1:{max:10,time:35,speed:70,spawn:1100,vals:[1,2,5,10],power:.13,obstacle:0},2:{max:20,time:32,speed:95,spawn:900,vals:[1,2,5,10,20],power:.11,obstacle:.06},3:{max:50,time:30,speed:125,spawn:720,vals:[.5,1,2,5,10,20],power:.1,obstacle:.11}};
let L=1,cfg=CFG[1],target=0,total=0,score=0,combo=0,time=0,running=false,items=[],spawnT=0,lastT=0,timerT=0,raf=0,basketX=.5,freezeUntil=0,shield=0,magnetUntil=0,sound=true,audio=null,roundNo=0;
function fmt(n){return n%1?n.toFixed(1):String(n)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
/* ================= SOUND: asset files only (assets/dubi-sound.js) ================= */
function stopSound(){DubiSound.stop()}
function speakParts(parts){DubiSound.speak(sound?parts:[])}
function priceParts(v){return DubiSound.money(v)}
function speak(idOrParts,text){if(Array.isArray(idOrParts)){speakParts(idOrParts);return}speakParts([{id:idOrParts,text:text}])}
function moneyObj(v){return MONEY.find(m=>m.v===v)}
function setBasket(px){const r=$('arena').getBoundingClientRect();basketX=clamp((px-r.left)/r.width,.08,.92);$('basket').style.left=(basketX*100)+'%'}
function pointer(e){setBasket(e.touches?e.touches[0].clientX:e.clientX)}
$('arena').addEventListener('pointerdown',pointer);$('arena').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});$('arena').addEventListener('touchstart',pointer,{passive:false});$('arena').addEventListener('touchmove',e=>{e.preventDefault();pointer(e)},{passive:false});
function newTarget(){const unit=L===3?.5:1;target=Math.round((2+Math.random()*(cfg.max-2))/unit)*unit;target=Math.max(unit,target);$('target').textContent=fmt(target)+' ₪'}
function start(l){L=l;cfg=CFG[l];score=0;roundNo=0;$('score').textContent=0;$('levelPill').textContent='⭐'.repeat(l);$('start').classList.add('hide');newRound()}
function newRound(){clearItems();newTarget();total=0;combo=0;time=cfg.time;shield=0;freezeUntil=0;magnetUntil=0;running=true;roundNo++;updateHUD();showMsg('אספו בדיוק '+fmt(target)+' ₪! 🎯');speakParts([{id:'catch_target',text:'אספו בדיוק'}].concat(priceParts(target)));lastT=performance.now();spawnT=0;timerT=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function clearItems(){items.forEach(o=>o.el.remove());items=[]}
function spawn(){if(!running)return;let roll=Math.random();if(roll<cfg.power){spawnPower();return}if(roll<cfg.power+cfg.obstacle){spawnObstacle();return}let safe=cfg.vals.filter(v=>v<=target+5),v=pick(safe),m=moneyObj(v),el=document.createElement('div');el.className='money-drop '+m.k+(Math.random()<.06?' golden':'');let im=new Image();im.src=m.f;im.alt=m.n;im.draggable=false;let scale=innerWidth<500?.8:1;im.style.width=(m.w*scale)+'px';im.style.height=(m.h*scale)+'px';el.append(im);const ar=$('arena');let max=Math.max(10,ar.clientWidth-m.w*scale-10);let x=10+Math.random()*max;el.style.left=x+'px';el.style.top=(-m.h-10)+'px';ar.append(el);items.push({el,x,y:-m.h-10,v,type:'money',gold:el.classList.contains('golden'),speed:cfg.speed*(.86+Math.random()*.4)})}
function spawnPower(){let types=['freeze','magnet','shield'],type=pick(types),emoji={freeze:'❄️',magnet:'🧲',shield:'🛡️'}[type],el=document.createElement('div');el.className='power';el.textContent=emoji;let x=20+Math.random()*($('arena').clientWidth-70);el.style.left=x+'px';el.style.top='-50px';$('arena').append(el);items.push({el,x,y:-50,type,speed:cfg.speed*.82})}
function spawnObstacle(){let el=document.createElement('div');el.className='power';el.textContent=pick(['💣','🪨']);let x=20+Math.random()*($('arena').clientWidth-70);el.style.left=x+'px';el.style.top='-50px';$('arena').append(el);items.push({el,x,y:-50,type:'bad',speed:cfg.speed})}
function basketRect(){return $('basket').getBoundingClientRect()}
function hit(o){let r=o.el.getBoundingClientRect(),b=basketRect();return r.bottom>b.top+8&&r.top<b.bottom&&r.right>b.left+8&&r.left<b.right-8}
function collect(o){if(o.type==='money'){let next=Math.round((total+o.v)*10)/10;if(next>target){if(shield){shield=0;DubiSound.sfx('powerup');showMsg('🛡️ המגן הציל אתכם!');speak('catch_shield_save','המגן הציל אתכם');renderPowers()}else{combo=0;shakeBasket();DubiSound.sfx('wrong');showMsg('כמעט! '+fmt(o.v)+' ₪ היו יותר מדי');speak('catch_too_much','כמעט, הכסף הזה היה יותר מדי')}}else{total=next;combo++;DubiSound.sfx(o.gold?'powerup':'catch');let mult=Math.min(3,1+Math.floor(combo/4));score+=(o.gold?30:10)*mult;$('score').textContent=score;pop(o.el,o.gold?'✨ +30':'+'+fmt(o.v)+' ₪');if(total===target){updateHUD();remove(o);winRound();return}}}else if(o.type==='freeze'){DubiSound.sfx('powerup');freezeUntil=performance.now()+6000;showMsg('❄️ הזמן הואט!');speak('catch_freeze','הזמן הואט')}else if(o.type==='magnet'){DubiSound.sfx('powerup');magnetUntil=performance.now()+6000;showMsg('🧲 מגנט כסף!');speak('catch_magnet','מגנט כסף')}else if(o.type==='shield'){DubiSound.sfx('powerup');shield=1;showMsg('🛡️ קיבלתם מגן!');speak('catch_shield_get','קיבלתם מגן')}else if(o.type==='bad'){if(shield){shield=0;DubiSound.sfx('powerup');showMsg('🛡️ המגן עצר את המכשול');speak('catch_shield_block','המגן עצר את המכשול')}else{combo=0;time=Math.max(0,time-3);shakeBasket();DubiSound.sfx('bomb');showMsg('זהירות! איבדתם 3 שניות');speak('catch_bomb','זהירות! איבדתם שלוש שניות')}}remove(o);updateHUD();renderPowers()}
function remove(o){let i=items.indexOf(o);if(i>=0)items.splice(i,1);o.el.remove()}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-lastT)/1000);lastT=now;spawnT+=dt*1000;timerT+=dt;if(spawnT>cfg.spawn){spawnT=0;spawn()}if(timerT>=1){let n=Math.floor(timerT);timerT-=n;time-=n;if(time<=0){time=0;loseRound();return}updateHUD()}let frozen=now<freezeUntil;for(let o of [...items]){if(o.type==='money'&&now<magnetUntil){let cx=basketRect().left+basketRect().width/2-$('arena').getBoundingClientRect().left;o.x+=(cx-o.x)*dt*1.4;o.el.style.left=o.x+'px'}o.y+=o.speed*dt*(frozen?.42:1);o.el.style.top=o.y+'px';if(hit(o))collect(o);else if(o.y>$('arena').clientHeight+80)remove(o)}updateHUD();raf=requestAnimationFrame(loop)}
function updateHUD(){$('total').textContent=fmt(total)+' ₪';$('time').textContent=time;let pct=Math.min(100,total/target*100);$('fill').style.width=pct+'%';$('fill').classList.toggle('over',total>target);let mult=Math.min(3,1+Math.floor(combo/4));$('combo').textContent='🔥 x'+mult;$('combo').classList.toggle('hot',mult>1)}
function renderPowers(){let p=$('powers');p.innerHTML='';if(shield)p.innerHTML+='<span class="power-badge">🛡️ מגן</span>';if(performance.now()<freezeUntil)p.innerHTML+='<span class="power-badge">❄️ האטה</span>';if(performance.now()<magnetUntil)p.innerHTML+='<span class="power-badge">🧲 מגנט</span>'}
function showMsg(t){let m=$('message');m.textContent=t;m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function shakeBasket(){let b=$('basket');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function pop(el,t){let p=document.createElement('div'),r=el.getBoundingClientRect(),a=$('arena').getBoundingClientRect();p.className='catch-pop';p.textContent=t;p.style.left=(r.left-a.left)+'px';p.style.top=(r.top-a.top)+'px';$('arena').append(p);setTimeout(()=>p.remove(),850)}
function winRound(){running=false;cancelAnimationFrame(raf);roundNo++;DubiSound.sfx('celebrate');confetti();let bonus=time*5;score+=bonus;$('score').textContent=score;$('modal').innerHTML='<div class="big">🎉🧺</div><div class="win-title">בדיוק '+fmt(target)+' ₪!</div><div class="sub">איזה תפיסה מעולה! נשארו '+time+' שניות.</div><div class="stars-win">⭐ ⭐ ⭐</div><div class="sub">בונוס זמן: +'+bonus+'</div><div class="btns"><button class="btn green" id="next">עוד סיבוב ➡️</button><button class="btn blue" id="menu">🏠 תפריט</button></div>';$('over').classList.add('show');speakParts([{id:'catch_win',text:'כל הכבוד, תפסתם בדיוק'}].concat(priceParts(target)));$('next').onclick=()=>{$('over').classList.remove('show');newRound()};$('menu').onclick=home}
function loseRound(){running=false;cancelAnimationFrame(raf);$('modal').innerHTML='<div class="big">⏰</div><div class="win-title">כמעט הצלחתם!</div><div class="sub">אספתם '+fmt(total)+' ₪ מתוך '+fmt(target)+' ₪.</div><div class="sub">מנסים שוב, אתם יכולים! 💪</div><div class="btns"><button class="btn green" id="retry">🔄 שוב</button><button class="btn blue" id="menu">🏠 תפריט</button></div>';$('over').classList.add('show');DubiSound.sfx('wrong');speak('catch_lose','נגמר הזמן! כמעט הצלחתם. נסו שוב, אתם יכולים!');$('retry').onclick=()=>{$('over').classList.remove('show');newRound()};$('menu').onclick=home}
function home(){running=false;cancelAnimationFrame(raf);clearItems();$('over').classList.remove('show');$('start').classList.remove('hide');speak('catch_welcome','תופסים כסף! בחרו רמה, ותפסו בדיוק את הסכום!')}
function confetti(){let c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let b=[];for(let i=0;i<150;i++)b.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-7-Math.random()*11,c:pick(['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff']),l:100});(function d(){x.clearRect(0,0,c.width,c.height);b=b.filter(q=>q.l-->0);b.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.3;x.fillStyle=q.c;x.fillRect(q.x,q.y,7,5)});if(b.length)requestAnimationFrame(d)})()}
document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());document.querySelectorAll('img').forEach(i=>i.draggable=false);document.querySelectorAll('.level').forEach(b=>{b.draggable=false;b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>start(+b.dataset.l)});$('home').onclick=home;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';DubiSound.setMuted(!sound)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;cancelAnimationFrame(raf);showMsg('המשחק נעצר')}});
setTimeout(()=>{if(!running)speak('catch_welcome','תופסים כסף! בחרו רמה, ותפסו בדיוק את הסכום!')},350);
</script>
</body></html>
