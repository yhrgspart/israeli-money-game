<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>החנות של דובי</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#78d8f5,#fff0b2);color:#123b61}.app{max-width:1100px;margin:auto;padding:12px}h1{text-align:center;color:#fff;text-shadow:0 4px #ed8a31;font-size:40px;margin:5px}.stats,.levels,.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill,.levels button{background:#fff;border-radius:18px;padding:9px 18px;font-weight:bold;box-shadow:0 5px #ddae35;border:0}.levels button{border:3px solid #00b983;color:#08795b;box-shadow:none}.levels button.on{background:#00c995;color:#fff}.shop,.panel{background:#fff;border-radius:28px;margin:16px 0;padding:16px;box-shadow:0 8px #137d9f}.shop{border:6px solid #ff9e40;box-shadow:0 8px #db7923;display:flex;justify-content:center;align-items:center;gap:18px;text-align:center}.bear,.thing{font-size:58px}.price{font-size:46px;font-weight:900;color:#e83f70}.question,.title{font-size:20px;font-weight:bold}.panel.pay{border:6px solid #00c995;box-shadow:0 8px #078d6d}.moneybox{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:90px}.money{cursor:pointer;filter:drop-shadow(0 5px 5px #0005);transition:.15s}.money:hover{transform:translateY(-5px) scale(1.04)}.money img{display:block;object-fit:contain}.coin img{border-radius:50%}.total,.message,.stars{text-align:center;font-size:26px;font-weight:bold;min-height:35px}.total span{font-size:34px;color:#e83f70}.progress{max-width:560px;height:18px;border:3px solid #178aaf;border-radius:20px;overflow:hidden;margin:10px auto}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00c995,#ffd447)}.buttons button{border:0;border-radius:18px;padding:14px 26px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer}.check{background:#00c995}.clear{background:#168db7}.next{background:#ff9e40}.good{color:#00976e}.bad{color:#e83f70}.note{text-align:center;font-size:12px;opacity:.7}@media(max-width:650px){h1{font-size:28px}.money.bill img{width:170px!important;height:auto!important}.bear,.thing{font-size:42px}}


.progress{position:relative;overflow:visible!important;background:#e9f4f7}
.progress i{border-radius:14px;transition:width .25s,background .25s,box-shadow .25s}
.progress.over{border-color:#ef3f62;animation:overShake .34s ease}
.progress.over i{background:linear-gradient(90deg,#ffbf31,#ff3b57);box-shadow:0 0 13px #ff3b57}
.overflow-bubble{position:absolute;left:0;top:-43px;display:none;align-items:center;gap:5px;background:#ef3f62;color:#fff;border:3px solid #fff;border-radius:16px;padding:5px 11px;font-size:16px;font-weight:900;box-shadow:0 4px 0 #b91f40;white-space:nowrap;z-index:3}
.progress.over .overflow-bubble{display:flex;animation:bubblePop .3s ease both}
.overflow-bubble:after{content:'';position:absolute;left:18px;bottom:-9px;border:7px solid transparent;border-top-color:#ef3f62;border-bottom:0}
@keyframes overShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes bubblePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

#celebration{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.celebrate-pop{animation:celebratePop .7s ease both}
@keyframes celebratePop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
</style></head><body><canvas id="celebration" aria-hidden="true"></canvas><main class="app"><h1>🛒 החנות של דובי</h1><div class="stats"><div class="pill">🏆 ניקוד: <b id="score">0</b></div><div class="pill">⭐ כוכבים: <b id="sc">0</b></div><div class="pill">❓ שאלה: <b id="qn">1</b></div></div><div class="levels"><button class="on" data-l="1">קל</button><button data-l="2">בינוני</button><button data-l="3">אלוף</button></div><section class="shop"><div class="bear">🐻</div><div><div class="thing" id="thing"></div><div class="question" id="question"></div><div class="price" id="target"></div></div></section><section class="panel pay"><div class="title">🧺 הקופה שלי</div><div class="moneybox" id="tray"></div><div class="progress" id="progress"><i id="prog"></i><span class="overflow-bubble" id="overflowBubble">⚠️ יותר מדי</span></div><div class="total">סה״כ: <span id="sum">0 ₪</span></div></section><div class="message" id="msg"></div><div class="stars" id="stars"></div><div class="buttons"><button class="check" id="check">✅ בדיקה</button><button class="clear" id="clear">🔄 לנקות</button><button class="next" id="next">➡️ שאלה חדשה</button></div><section class="panel"><div class="title">👛 הארנק שלי - לחצו על מטבע או שטר כדי לשלם</div><div class="moneybox" id="wallet"></div></section><div class="note">תמונות הצד הקדמי מתוך הקבצים שסופקו • הגדלים מוצגים לפי המידות שסומנו בקבצים</div></main><script>
const $=x=>document.getElementById(x);const M=[
{v:.1,n:'10 אגורות',f:'assets/coin-10-agorot.png',w:66,h:66,k:'coin'},{v:.5,n:'חצי שקל',f:'assets/coin-half-shekel.png',w:78,h:78,k:'coin'},{v:1,n:'שקל אחד',f:'assets/coin-1-shekel.png',w:54,h:54,k:'coin'},{v:2,n:'שני שקלים',f:'assets/coin-2-shekels.png',w:65,h:65,k:'coin'},{v:5,n:'חמישה שקלים',f:'assets/coin-5-shekels.png',w:72,h:72,k:'coin'},{v:10,n:'עשרה שקלים',f:'assets/coin-10-shekels.png',w:69,h:69,k:'coin'},{v:20,n:'20 שקלים',f:'assets/bill-20.jpg',w:200,h:110,k:'bill'},{v:50,n:'50 שקלים',f:'assets/bill-50.jpg',w:211,h:110,k:'bill'},{v:100,n:'100 שקלים',f:'assets/bill-100.jpg',w:222,h:110,k:'bill'},{v:200,n:'200 שקלים',f:'assets/bill-200.jpg',w:233,h:110,k:'bill'}];
const ORDER=[200,100,50,20,10,5,2,1,.5,.1],G=[['גלידה','🍦'],['כדור','⚽'],['ספר','📚'],['פיצה','🍕'],['מיץ','🧃'],['בובה','🧸']];let level=1,target=0,tray=[],score=0,stars=0,q=1,checking=false;
const celebrateCanvas=$('celebration'),celebrateCtx=celebrateCanvas.getContext('2d');
let celebrationBits=[],celebrationFrame=0;
function resizeCelebration(){celebrateCanvas.width=innerWidth*devicePixelRatio;celebrateCanvas.height=innerHeight*devicePixelRatio;celebrateCanvas.style.width=innerWidth+'px';celebrateCanvas.style.height=innerHeight+'px';celebrateCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resizeCelebration);resizeCelebration();
function celebrate(){
 cancelAnimationFrame(celebrationFrame);celebrationBits=[];
 const colors=['#ff3b6b','#ffd447','#00c995','#168db7','#9b5cff','#ff9e40'];
 for(let i=0;i<180;i++) celebrationBits.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.38,vx:(Math.random()-.5)*15,vy:-8-Math.random()*12,g:.25+Math.random()*.18,r:Math.random()*6.28,w:6+Math.random()*8,h:4+Math.random()*7,c:colors[i%colors.length],life:90+Math.random()*45});
 $('msg').classList.remove('celebrate-pop');void $('msg').offsetWidth;$('msg').classList.add('celebrate-pop');
 function draw(){celebrateCtx.clearRect(0,0,innerWidth,innerHeight);celebrationBits=celebrationBits.filter(p=>p.life-->0);for(const p of celebrationBits){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.18;celebrateCtx.save();celebrateCtx.translate(p.x,p.y);celebrateCtx.rotate(p.r);celebrateCtx.fillStyle=p.c;celebrateCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);celebrateCtx.restore()}if(celebrationBits.length)celebrationFrame=requestAnimationFrame(draw);else celebrateCtx.clearRect(0,0,innerWidth,innerHeight)}draw();
}

function el(m){let d=document.createElement('div');d.className='money '+m.k;let i=new Image;i.src=m.f;i.alt=m.n;i.draggable=false;i.style.width=m.w+'px';i.style.height=m.h+'px';d.append(i);return d}function levelMoney(){let max=level===1?20:level===2?100:200;return ORDER.filter(v=>v<=max).map(v=>M.find(x=>x.v===v))}function wallet(){let w=$('wallet');w.innerHTML='';levelMoney().forEach(m=>{let d=el(m);d.onclick=()=>{tray.push(m);render()};w.append(d)})}function total(){return Math.round(tray.reduce((a,x)=>a+x.v,0)*100)/100}function fmt(n){return n%1?n.toFixed(2):n}function render(){let t=$('tray');t.innerHTML='';tray.forEach((m,j)=>{let d=el(m);d.onclick=()=>{tray.splice(j,1);render()};t.append(d)});let s=total(),over=Math.round((s-target)*100)/100,pct=target?Math.min(100,s/target*100):0,progress=$('progress');$('sum').textContent=fmt(s)+' ₪';$('prog').style.width=pct+'%';progress.classList.toggle('over',over>0);$('overflowBubble').textContent=over>0?'⚠️ יותר מדי ב־'+fmt(over)+' ₪':'';$('msg').textContent=''}function newq(){tray=[];target=level===1?2+Math.floor(Math.random()*18):level===2?(2+Math.floor(Math.random()*39))*5:Math.round((1+Math.random()*200)*10)/10;let g=G[Math.floor(Math.random()*G.length)];$('thing').textContent=g[1];$('question').textContent='כמה כסף צריך בשביל '+g[0]+'?';$('target').textContent=fmt(target)+' ₪';$('qn').textContent=q;render()}$('check').onclick=()=>{let s=total(),d=Math.round(Math.abs(s-target)*100)/100;if(s===target&&!checking){checking=true;score+=10;stars++;q++;$('score').textContent=score;$('sc').textContent=stars;$('stars').textContent='⭐'.repeat(Math.min(stars,10));$('msg').innerHTML='<span class="good">כל הכבוד! בדיוק נכון! 🎉</span>';celebrate();setTimeout(()=>{checking=false;newq()},2200)}else $('msg').innerHTML='<span class="bad">'+(s<target?'חסר ':'יש יותר מדי ')+fmt(d)+' ₪</span>'};$('clear').onclick=()=>{tray=[];render()};$('next').onclick=()=>{q++;newq()};document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.levels button').forEach(x=>x.classList.remove('on'));b.classList.add('on');level=+b.dataset.l;wallet();newq()});wallet();newq();
</script></body></html>
